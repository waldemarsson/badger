name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # The AGENTS.md gates. A tag publishes nothing unless they all pass.
  gates:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: npm ci

      # generate_context! needs frontendDist (../build) to exist at compile time.
      - name: Build frontend
        run: npm run vite:build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Cache ONNX Runtime prebuilt
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/Library/Caches/ort.pyke.io
          key: ort-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ort-${{ runner.os }}-

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all -- -D warnings

      - name: cargo test
        run: cargo test

      - name: npm run check
        run: npm run check

      - name: npm run lint
        run: npm run lint

      - name: Frontend unit tests
        run: node --test tests/*.mjs

  release-macos:
    needs: gates
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The bundle takes its version from tauri.conf.json, so a tag that
      # disagrees would ship a mislabelled app. Accept v<version> or
      # v<version>-<suffix> (e.g. v1.0.0, v1.0.0-31).
      - name: Check tag matches app version
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          tag="$GITHUB_REF_NAME"
          if [[ "$tag" != "v$version" && "$tag" != "v$version-"* ]]; then
            echo "::error::Tag $tag does not match app version $version (expected v$version or v$version-<suffix>)"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # ort's build script downloads ONNX Runtime (SHA-256 checked) into this
      # cache dir and skips the download when it is already there.
      - name: Cache ONNX Runtime prebuilt
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/Library/Caches/ort.pyke.io
          key: ort-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ort-${{ runner.os }}-

      - name: Build and release .dmg
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target aarch64-apple-darwin
          tagName: ${{ github.ref_name }}
          releaseName: Badger ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
