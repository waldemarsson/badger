[package]
name = "badger"
version = "1.10.0"
description = "Badger macOS Desktop App"
authors = ["you"]
edition = "2021"

[lib]
name = "badger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api`: the floating palette window is transparent (rounded card, no box).
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-dialog = "2"
# Native reminder notifications (Rust-only: no JS package, no capability entry).
tauri-plugin-notification = "2.8"
# In-app updates from GitHub Releases (Rust-only: no JS package, no capability entry).
tauri-plugin-updater = "2.14"
# Global "show Badger" shortcut set in Settings (Rust-only: no JS package, no capability entry).
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", features = ["sqlite", "runtime-tokio", "macros"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
chrono = "0.4"
# Gzip container for backup files.
flate2 = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
tauri-plugin-opener = "2.5"
# Semantic search: in-process embedding model (ONNX Runtime, statically linked from the
# prebuilt binaries `ort` downloads at build time), its tokenizer, and the opt-in model
# download (GET only, SHA-256 verified).
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-rustls", "api-22"] }
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
sha2 = "0.11"
# Optional encryption of automatic backups (X25519 recipients; files decrypt with the age CLI).
age = { version = "0.12", default-features = false }
# Playground: sandboxed JavaScript (QuickJS). A fresh runtime per run, no host access
# beyond console output and read-only note(); >= 0.14.0 for the bundled quickjs-ng fixes.
rquickjs = "0.14"

# Apple Reminders sync (EventKit). macOS only; the rest of the app never links it.
[target.'cfg(target_os = "macos")'.dependencies]
# The floating palette as a non-activating panel (the menu bar stays on the app in front).
tauri-nspanel = "2.1"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSArray", "NSCalendar", "NSDate", "NSError", "NSNotification", "NSObject", "NSOperation", "NSString", "NSTimeZone"] }
objc2-event-kit = { version = "0.3", default-features = false, features = ["std", "bitflags", "block2", "EKAlarm", "EKCalendar", "EKCalendarItem", "EKEventStore", "EKObject", "EKRecurrenceRule", "EKReminder", "EKSource", "EKTypes"] }
