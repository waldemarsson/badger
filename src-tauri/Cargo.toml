[package]
name = "badger"
version = "1.0.0"
description = "Badger macOS Desktop App"
authors = ["you"]
edition = "2021"

[lib]
name = "badger_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
# Native reminder notifications (Rust-only: no JS package, no capability entry).
tauri-plugin-notification = "2.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio", "macros"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
chrono = "0.4"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
tauri-plugin-opener = "2.5"
# Semantic search: in-process embedding model (ONNX Runtime, statically linked from the
# prebuilt binaries `ort` downloads at build time), its tokenizer, and the opt-in model
# download (GET only, SHA-256 verified).
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "download-binaries", "tls-rustls", "api-22"] }
tokenizers = { version = "0.22", default-features = false, features = ["fancy-regex"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
sha2 = "0.10"
