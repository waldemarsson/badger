name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # The AGENTS.md gates. A tag publishes nothing unless they all pass.
  gates:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Installed apps only accept updates signed by the key behind this pubkey; the
      # placeholder verifies nothing, so never ship it.
      - name: Check updater public key is set
        run: |
          if jq -e '.plugins.updater.pubkey | test("^REPLACE_")' src-tauri/tauri.conf.json > /dev/null; then
            echo "::error::plugins.updater.pubkey in src-tauri/tauri.conf.json is still the placeholder"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: npm ci

      # generate_context! needs frontendDist (../build) to exist at compile time.
      - name: Build frontend
        run: npm run vite:build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache Rust build
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Cache ONNX Runtime prebuilt
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/Library/Caches/ort.pyke.io
          key: ort-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ort-${{ runner.os }}-

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all -- -D warnings

      - name: cargo test
        run: cargo test

      - name: npm run check
        run: npm run check

      - name: npm run lint
        run: npm run lint

      - name: Frontend unit tests
        run: node --test tests/*.mjs

  release-macos:
    needs: gates
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # The bundle takes its version from tauri.conf.json, so a tag that
      # disagrees would ship a mislabelled app. Accept v<version> or
      # v<version>-<suffix> (e.g. v1.0.0, v1.0.0-31).
      - name: Check tag matches app version
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          tag="$GITHUB_REF_NAME"
          if [[ "$tag" != "v$version" && "$tag" != "v$version-"* ]]; then
            echo "::error::Tag $tag does not match app version $version (expected v$version or v$version-<suffix>)"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      # ort's build script downloads ONNX Runtime (SHA-256 checked) into this
      # cache dir and skips the download when it is already there.
      - name: Cache ONNX Runtime prebuilt
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/Library/Caches/ort.pyke.io
          key: ort-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ort-${{ runner.os }}-

      # Signs with the self-signed "Badger Code Signing" certificate instead of ad-hoc, so
      # macOS keeps privacy permissions (notifications, Reminders) across updates. The
      # identity goes in through a --config override; tauri.conf.json stays ad-hoc for
      # local builds. Secret names avoid APPLE_CERTIFICATE so Tauri doesn't import twice.
      - name: Import code-signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$MACOS_CERTIFICATE" || -z "$MACOS_CERTIFICATE_PASSWORD" ]]; then
            echo "::error::MACOS_CERTIFICATE and MACOS_CERTIFICATE_PASSWORD secrets must be set (see docs/configuration.md)"
            exit 1
          fi
          keychain="$RUNNER_TEMP/badger-signing.keychain-db"
          keychain_password=$(openssl rand -hex 24)
          p12="$RUNNER_TEMP/badger-signing.p12"
          pem="$RUNNER_TEMP/badger-signing.pem"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          read -r -a existing <<< "$(security list-keychains -d user | tr -d '"' | tr '\n' ' ')"
          security list-keychains -d user -s "$keychain" "${existing[@]}"
          # A self-signed certificate is untrusted until marked trusted for code signing.
          # The temporary keychain holds only this certificate.
          security find-certificate -a -p "$keychain" > "$pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$pem"
          rm -f "$p12" "$pem"
          # -v lists only valid identities, so this also proves the trust step worked.
          identity=$(security find-identity -v -p codesigning "$keychain" | awk 'NR==1 && $2 ~ /^[0-9A-F]{40}$/ {print $2}')
          if [[ -z "$identity" ]]; then
            echo "::error::No valid code-signing identity in the imported certificate"
            security find-identity -p codesigning "$keychain"
            exit 1
          fi
          jq -n --arg id "$identity" '{bundle: {macOS: {signingIdentity: $id}}}' > "$RUNNER_TEMP/signing.conf.json"

      # Also signs the updater bundle (Badger.app.tar.gz + .sig) and uploads latest.json,
      # whose version comes from tauri.conf.json.
      - name: Build and release .dmg
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target aarch64-apple-darwin --config ${{ runner.temp }}/signing.conf.json
          tagName: ${{ github.ref_name }}
          releaseName: Badger ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
