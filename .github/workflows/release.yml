name: Release

on:
  push:
    tags: ['v*']

jobs:
  release-macos:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The bundle takes its version from tauri.conf.json, so a tag that
      # disagrees would ship a mislabelled app. Accept v<version> or
      # v<version>-<suffix> (e.g. v1.0.0, v1.0.0-31).
      - name: Check tag matches app version
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          tag="$GITHUB_REF_NAME"
          if [[ "$tag" != "v$version" && "$tag" != "v$version-"* ]]; then
            echo "::error::Tag $tag does not match app version $version (expected v$version or v$version-<suffix>)"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2

      # ort's build script downloads ONNX Runtime (SHA-256 checked) into this
      # cache dir and skips the download when it is already there.
      - name: Cache ONNX Runtime prebuilt
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ort.pyke.io
          key: ort-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ort-${{ runner.os }}-

      - name: Build and release .dmg
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target aarch64-apple-darwin
          tagName: ${{ github.ref_name }}
          releaseName: Badger ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
