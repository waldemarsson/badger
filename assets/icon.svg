<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
<defs>
  <clipPath id="sq">
    <rect x="0" y="0" width="400" height="400" rx="90" ry="90"/>
  </clipPath>
</defs>

<!-- Squircle background -->
<rect x="0" y="0" width="400" height="400" rx="90" ry="90" fill="#10101E"/>

<!-- Atmosphere glow -->
<ellipse cx="200" cy="200" rx="160" ry="160" fill="#1E1E3A" clip-path="url(#sq)"/>

<!-- Outer decorative ring -->
<circle cx="200" cy="200" r="155" fill="none" stroke="#1E1E40" stroke-width="1.5"/>

<!-- Clock face ring -->
<circle cx="200" cy="200" r="140" fill="none" stroke="#22224A" stroke-width="1"/>
<circle cx="200" cy="200" r="132" fill="#13132A"/>

<!-- Hour tick marks -->
<g stroke="#3A3A70" stroke-width="2.5" stroke-linecap="round">
  <line x1="200" y1="76"  x2="200" y2="92"/>
  <line x1="302" y1="98"  x2="294" y2="112"/>
  <line x1="324" y1="200" x2="308" y2="200"/>
  <line x1="302" y1="302" x2="294" y2="288"/>
  <line x1="200" y1="324" x2="200" y2="308"/>
  <line x1="98"  y1="302" x2="106" y2="288"/>
  <line x1="76"  y1="200" x2="92"  y2="200"/>
  <line x1="98"  y1="98"  x2="106" y2="112"/>
</g>

<!-- Minor ticks -->
<g stroke="#252550" stroke-width="1.2" stroke-linecap="round">
  <line x1="248" y1="69"  x2="245" y2="79"/>
  <line x1="288" y1="87"  x2="282" y2="96"/>
  <line x1="330" y1="152" x2="321" y2="156"/>
  <line x1="336" y1="246" x2="327" y2="242"/>
  <line x1="310" y1="310" x2="304" y2="302"/>
  <line x1="247" y1="332" x2="243" y2="323"/>
  <line x1="153" y1="332" x2="157" y2="323"/>
  <line x1="90"  y1="310" x2="96"  y2="302"/>
  <line x1="64"  y1="246" x2="73"  y2="242"/>
  <line x1="70"  y1="152" x2="79"  y2="156"/>
  <line x1="112" y1="87"  x2="118" y2="96"/>
  <line x1="152" y1="69"  x2="155" y2="79"/>
</g>

<!-- Progress track -->
<circle cx="200" cy="200" r="112"
  fill="none" stroke="#1A1A38" stroke-width="8"/>

<!-- Progress arc ~65% -->
<circle cx="200" cy="200" r="112"
  fill="none" stroke="#5B5FEF" stroke-width="8" stroke-linecap="round"
  stroke-dasharray="456 248"
  transform="rotate(-90 200 200)"/>

<!-- Minute hand -->
<line x1="200" y1="200" x2="200" y2="110"
  stroke="#E8E8FF" stroke-width="4" stroke-linecap="round"/>

<!-- Hour hand -->
<line x1="200" y1="200" x2="264" y2="162"
  stroke="#E8E8FF" stroke-width="6" stroke-linecap="round"/>

<!-- Second hand -->
<line x1="200" y1="200" x2="170" y2="270"
  stroke="#FF6B6B" stroke-width="2.5" stroke-linecap="round"/>
<!-- Counterweight -->
<line x1="200" y1="200" x2="212" y2="178"
  stroke="#FF6B6B" stroke-width="2.5" stroke-linecap="round"/>

<!-- Center hub -->
<circle cx="200" cy="200" r="10" fill="#5B5FEF"/>
<circle cx="200" cy="200" r="5"  fill="#E8E8FF"/>


</svg>
