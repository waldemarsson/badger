name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release-macos:
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # ort's build script downloads ONNX Runtime (SHA-256 checked) into this
      # cache dir and skips the download when it is already there.
      - name: Cache ONNX Runtime prebuilt
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ort.pyke.io
          key: ort-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ort-${{ runner.os }}-

      - name: Build and release .dmg
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: --target aarch64-apple-darwin
          tagName: v__VERSION__-${{ github.run_number }}
          releaseName: TimeTracker v__VERSION__-${{ github.run_number }}
          releaseDraft: false
          prerelease: false
